name: PKpowerlines Stable release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify main contains tagged release commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Build DMG
        run: ./package_dmg.sh

      - name: Read version
        id: ver
        run: |
          version="$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' release/macos/PKpowerlines.app/Contents/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Create Sparkle update archive
        run: ditto -c -k --sequesterRsrc --keepParent release/macos/PKpowerlines.app "dist/PKpowerlines-${{ steps.ver.outputs.version }}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/PKpowerlines-${{ steps.ver.outputs.version }}.dmg" "dist/PKpowerlines-${{ steps.ver.outputs.version }}.zip" \
            --target "$GITHUB_SHA" --title "PKpowerlines ${{ steps.ver.outputs.version }}" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" "dist/PKpowerlines-${{ steps.ver.outputs.version }}.dmg" "dist/PKpowerlines-${{ steps.ver.outputs.version }}.zip" --clobber

      - name: Sign Stable appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUNDLE_VERSION: ${{ steps.ver.outputs.bundle }}
        run: |
          awk 'BEGIN{p=0} /^## \[/{if(p)exit; p=1; next} p&&/^## /{exit} p' CHANGELOG.md > /tmp/notes.md
          python3 -m venv /tmp/sv
          /tmp/sv/bin/pip -q install cryptography
          /tmp/sv/bin/python packaging/sparkle_release.py "dist/PKpowerlines-$VERSION.zip" "v$VERSION" "$VERSION" "$BUNDLE_VERSION" mondary/Macos_PKpowerlines PKpowerlines 13.0 /tmp/notes.md

      - name: Publish Stable appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add appcast.xml
          git commit -m "MAJ: appcast pkpowerlines ${{ steps.ver.outputs.version }}" || exit 0
          git fetch origin main
          git rebase origin/main
          git push "https://x-access-token:${GH_TOKEN}@github.com/mondary/Macos_PKpowerlines.git" HEAD:main
