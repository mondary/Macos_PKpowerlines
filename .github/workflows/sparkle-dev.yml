name: Sparkle Dev build

on:
  push:
    branches: [main]
    paths:
      - Package.swift
      - src/macos/**
      - build_app.sh
      - appcast-dev.xml
      - .github/workflows/sparkle-dev.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pkpowerlines-dev
  cancel-in-progress: true

jobs:
  dev:
    if: ${{ !contains(github.event.head_commit.message, 'appcast') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Dev app
        env:
          PK_DEV_BUILD: "1"
        run: ./build_app.sh

      - name: Package app for Sparkle
        run: ditto -c -k --keepParent release/macos/PKpowerlines.app PKpowerlines-dev.zip

      - name: Read versions
        id: ver
        run: |
          echo "bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' release/macos/PKpowerlines.app/Contents/Info.plist)" >> "$GITHUB_OUTPUT"
          echo "short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' release/macos/PKpowerlines.app/Contents/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Upload permanent Dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create dev --prerelease --title "PKpowerlines Dev" --notes "Latest automatic Dev build from main." || true
          gh release upload dev PKpowerlines-dev.zip -R mondary/Macos_PKpowerlines --clobber

      - name: Sign Dev appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BUNDLE_VERSION: ${{ steps.ver.outputs.bundle }}
          SHORT_VERSION: ${{ steps.ver.outputs.short }}
        run: |
          python3 -m venv /tmp/sv
          /tmp/sv/bin/pip -q install cryptography
          /tmp/sv/bin/python packaging/sparkle_dev_release.py PKpowerlines-dev.zip "$BUNDLE_VERSION" "$SHORT_VERSION" mondary/Macos_PKpowerlines PKpowerlines 13.0

      - name: Publish Dev appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add appcast-dev.xml
          git commit -m "MAJ: appcast dev pkpowerlines" || exit 0
          git fetch origin main
          git rebase origin/main
          git push "https://x-access-token:${GH_TOKEN}@github.com/mondary/Macos_PKpowerlines.git" HEAD:main
